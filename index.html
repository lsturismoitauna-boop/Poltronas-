<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--line:#d5d9df;--free:#e8f3ff;--freeb:#3b82f6;--occ:#c9cdd3;--sel:#16a34a;--wc:#f1e3c0}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.sub,.note{opacity:.7;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;opacity:.8;margin:8px 0 4px}
input,select,button,textarea{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);box-sizing:border-box}
button.p{background:var(--sel);color:#fff;border:0;font-weight:600;margin-top:10px}button:disabled{opacity:.4}
button.sm{width:auto;padding:6px 10px;font-size:13px}
.bus{border:2px solid var(--line);border-radius:22px 22px 10px 10px;padding:12px 10px;margin-bottom:10px}
.front{text-align:center;font-size:12px;opacity:.6;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;gap:6px;margin-bottom:6px}
.s{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--freeb);background:var(--free);font-weight:600;font-size:14px;padding:0;width:100%}
.s.o{background:var(--occ);border-color:var(--occ);opacity:.7;text-decoration:line-through}
.s.x{background:var(--sel);border-color:var(--sel);color:#fff}
.w{aspect-ratio:2/1;grid-column:span 2;background:var(--wc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}
.stats{display:flex;gap:8px;margin:8px 0}.stats div{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:8px}.stats b{display:block;font-size:20px}
.tr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.err{color:#dc2626;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
@media print{.noprint{display:none!important}:root{--bg:#fff;--fg:#000;--card:#fff;--line:#999}body{padding:0}}
</style></head><body>

<script>

var CFG={apiKey:"AIzaSyC-oeb0ibkAXxoFi00AZvRV_aOIss4b1ss",authDomain:"ls-tur-poltronas.firebaseapp.com",projectId:"ls-tur-poltronas",appId:"1:563176792178:web:678ab3a43d4527633e62eb"};

firebase.initializeApp(CFG);var db=firebase.firestore(),auth=firebase.auth(),TS=firebase.firestore.FieldValue.serverTimestamp;
function mk(n,rows,tail){var r=[],k=n;for(var i=0;i<rows;i++){r.push([k,k+1,k+2,k+3]);k+=4}if(tail)r.push([k,k+1,'WC','WC']);return r}
function mk3(n,rows){var r=[],k=n;for(var i=0;i<rows;i++){r.push([k,k+1,null,k+2]);k+=3}return r}
var BUS={
'42sl':{nome:'42 lugares · Semileito',decks:[{t:'',r:mk(1,10,1)}]},
'46sl':{nome:'46 lugares · Semileito',decks:[{t:'',r:mk(1,11,1)}]},
'50ex':{nome:'50 lugares · Executivo',decks:[{t:'',r:mk(1,12,1)}]},
'54dd':{nome:'54 lugares · DD',decks:[{t:'Piso superior · Semileito',r:mk(1,10,1)},{t:'Piso inferior · Leito',r:mk3(43,4)}]},
'56dd':{nome:'56 lugares · DD',decks:[{t:'Piso superior · Semileito',r:mk(1,11,0)},{t:'Piso inferior · Leito',r:mk3(45,4)}]}};
function total(b){var n=0;BUS[b].decks.forEach(function(d){d.r.forEach(function(r){r.forEach(function(c){if(c!=='WC'&&c!==null)n++})})});return n}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var A=document.getElementById('app'),Q=new URLSearchParams(location.search),VID=Q.get('v'),unsubs=[];
function clear(){unsubs.forEach(function(u){u()});unsubs=[]}
function mapHtml(b,occ,sel){var h='';BUS[b].decks.forEach(function(d){h+=(d.t?'<h2>'+d.t+'</h2>':'')+'<div class="bus"><div class="front">▲ frente / motorista</div>';
d.r.forEach(function(r){h+='<div class="row">';r.forEach(function(c,i){if(i==2)h+='<span></span>';if(c===null){h+='<span></span>';return}if(c==='WC'){if(i==2)h+='<div class="w">WC</div>';return}
h+='<button class="s'+(occ[c]?' o':'')+(sel===c?' x':'')+'" data-n="'+c+'">'+c+'</button>'});h+='</div>'});h+='</div>'});return h}
function stats(b,occ){var o=Object.keys(occ).length,t=total(b);return '<div class="stats"><div><b>'+o+'</b>ocupadas</div><div><b>'+(t-o)+'</b>livres</div><div><b>'+t+'</b>total</div></div>'}

/* ---------- CLIENTE ---------- */
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function hid(v,n){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(v+'|'+norm(n))).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')})}
function desc(b,n){var r=null;BUS[b].decks.forEach(function(d){d.r.forEach(function(row){row.forEach(function(c,i){if(c===n)r=(i==0||i==3?'janela':'corredor')+(d.t?' · '+d.t.split(' · ')[0].toLowerCase():'')})})});return r}
function clientView(){
 var base='poltronas_viagens/'+VID;
 db.doc(base).get().then(function(d){
  if(!d.exists){A.innerHTML='<div class="card">Viagem não encontrada. Peça um novo link à LS Tur.</div>';return}
  var v=d.data(),occ={},sel=null,msg='',who=null,nome='',done=0,ja=0,mine=[],F={n:'',t:''},first=true;
  function closed(){return v.fechada||(v.limite&&new Date()>v.limite.toDate())}
  function head(){return '<h1>Escolha sua poltrona</h1><p class="sub">LS Tur Viagens e Turismo · '+esc(v.nome)+'</p>'}
  function minebox(){return mine.length?'<div class="card"><h2>Poltronas já escolhidas agora</h2>'+mine.map(function(m){return '<div class="tr"><span>'+esc(m.n)+'</span><b>poltrona '+m.s+'</b></div>'}).join('')+'</div>':''}
  function again(){who=null;nome='';sel=null;done=0;ja=0;msg='';F.n='';draw()}
  function draw(){
   if(done){
    A.innerHTML=head()+'<div class="card"><h2>Poltrona '+done+' reservada ✅</h2><p><b>'+esc(nome)+'</b>, sua poltrona é a <b>'+done+'</b> ('+desc(v.onibus,done)+').</p>'+mapHtml(v.onibus,occ,done)+'<button class="p" id="ot">Escolher poltrona de outro passageiro</button><button id="sh" style="margin-top:8px">Compartilhar no WhatsApp</button></div>'+minebox();
    document.getElementById('ot').onclick=again;
    document.getElementById('sh').onclick=function(){var t='Poltrona reservada na viagem '+v.nome+': '+mine.map(function(m){return m.n+' - poltrona '+m.s}).join('; ')+'.';window.open('https://wa.me/?text='+encodeURIComponent(t))};
    return}
   if(ja){
    A.innerHTML=head()+'<div class="card"><h2>Você já escolheu a poltrona '+ja+'</h2><p><b>'+esc(nome)+'</b>: poltrona <b>'+ja+'</b> ('+desc(v.onibus,ja)+'). Ela está marcada em verde no mapa. Para trocar, fale com a LS Tur.</p>'+mapHtml(v.onibus,occ,ja)+'<button class="p" id="ot">Pesquisar outro passageiro</button></div>'+minebox();
    document.getElementById('ot').onclick=again;return}
   if(closed()&&!v.lista){A.innerHTML=head()+'<div class="card"><h2>🔒 Escolha encerrada</h2><p>A escolha de poltronas desta viagem foi encerrada. Fale com a LS Tur.</p></div>';return}
   if(v.lista&&!who){
    A.innerHTML=head()+'<div class="card">'+(closed()?'<p class="err">🔒 Escolha encerrada. Você ainda pode consultar a sua poltrona.</p>':'')+'<label>Digite o nome completo do passageiro</label><input id="nm" autocomplete="off"><button class="p" id="vf">Continuar</button><p class="err">'+msg+'</p><p class="note">Pode escolher a poltrona de cada pessoa do seu grupo, uma de cada vez. Digite o nome completo, como no cadastro.</p></div>'+minebox();
    var n1=document.getElementById('nm');n1.value=F.n;n1.oninput=function(){F.n=n1.value};
    n1.onkeydown=function(e){if(e.key==='Enter')document.getElementById('vf').click()};
    document.getElementById('vf').onclick=function(){
     if(norm(F.n).length<3){msg='Digite o nome completo.';draw();return}
     hid(VID,F.n).then(function(h){return db.doc(base+'/convidados/'+h).get().then(function(g){
      if(!g.exists){msg='Não encontramos esse nome. Confira se digitou o nome completo, como no cadastro, ou fale com a LS Tur.';draw();return}
      nome=F.n.trim();
      if(g.data().seat){ja=+g.data().seat;draw();return}
      if(closed()){msg='A escolha de poltronas foi encerrada. Fale com a LS Tur.';draw();return}who=h;msg='';draw()})}).catch(function(){msg='Erro ao verificar. Tente novamente.';draw()});
    };
    return}
   var free=total(v.onibus)-Object.keys(occ).length;
   A.innerHTML=head()+(who?'<div class="card"><p>Escolhendo a poltrona de: <b>'+esc(nome)+'</b></p><button class="sm" id="ch">Trocar passageiro</button></div>':'')+'<div class="card">'+mapHtml(v.onibus,occ,sel)+'<p class="note">'+free+' poltronas livres · cinza = ocupada</p><label>Ou digite o número da poltrona</label><input id="sn" inputmode="numeric">'+(who?'':'<label>Seu nome completo</label><input id="nm"><label>Seu WhatsApp (com DDD)</label><input id="tl" inputmode="tel">')+'<p><b>'+(sel?'Poltrona '+sel+' · '+desc(v.onibus,sel):'')+'</b></p><button class="p" id="go">'+(sel?'Confirmar poltrona '+sel:'Toque em uma poltrona')+'</button><p class="err">'+msg+'</p></div>'+minebox();
   if(who)document.getElementById('ch').onclick=again;
   else{var n2=document.getElementById('nm'),t2=document.getElementById('tl');n2.value=F.n;t2.value=F.t;n2.oninput=function(){F.n=n2.value};t2.oninput=function(){F.t=t2.value}}
   document.getElementById('sn').onchange=function(e){var k=+e.target.value;if(!desc(v.onibus,k)){msg='Essa poltrona não existe neste ônibus.';draw();return}if(occ[k]){msg='A poltrona '+k+' já está ocupada.';draw();return}sel=k;msg='';draw()};
   A.querySelectorAll('.s').forEach(function(b){b.onclick=function(){var k=+b.dataset.n;if(occ[k])return;sel=k;msg='';draw()}});
   document.getElementById('go').onclick=function(){
    if(!sel||(!who&&(F.n.trim().length<3||F.t.replace(/\D/g,'').length<10))){msg=who?'Escolha uma poltrona.':'Escolha a poltrona e preencha nome e WhatsApp.';draw();return}
    var bt=db.batch(),nm=who?nome:F.n.trim();
    bt.set(db.doc(base+'/ocupadas/'+sel),who?{t:TS(),h:who}:{t:TS()});
    if(who){bt.update(db.doc(base+'/convidados/'+who),{seat:String(sel),t:TS()});bt.set(db.doc(base+'/reservas/'+sel),{h:who,nome:nm,t:TS()})}
    else bt.set(db.doc(base+'/reservas/'+sel),{nome:nm,tel:F.t.trim(),t:TS()});
    bt.commit().then(function(){nome=nm;mine.push({n:nm,s:sel});done=sel;draw()}).catch(function(){msg='Não foi possível reservar essa poltrona: ela pode ter acabado de ser reservada, ou a escolha foi encerrada. Escolha outra ou fale com a LS Tur.';sel=null;draw()});
   };
  }
  unsubs.push(db.collection(base+'/ocupadas').onSnapshot(function(s){occ={};s.forEach(function(x){occ[x.id]=1});if(sel&&occ[sel])sel=null;if(first||who||!v.lista||done||ja)draw();first=false}));
 });
}

/* ---------- ADMIN ---------- */
function loginView(m){A.innerHTML='<h1>LS Tur · Poltronas</h1><div class="card"><label>E-mail</label><input id="em" type="email"><label>Senha</label><input id="pw" type="password"><button class="p" id="li">Entrar</button><p class="err">'+(m||'')+'</p></div>';
 document.getElementById('li').onclick=function(){auth.signInWithEmailAndPassword(document.getElementById('em').value,document.getElementById('pw').value).catch(function(){loginView('E-mail ou senha incorretos.')})}}
function delTrip(id,nome){
 if(prompt('Para excluir a viagem "'+nome+'" e TODAS as reservas dela, digite EXCLUIR:')!=='EXCLUIR')return;
 var base='poltronas_viagens/'+id,subs=['ocupadas','reservas','convidados','passageiros'];
 Promise.all(subs.map(function(c){return db.collection(base+'/'+c).get()})).then(function(qs){
  var refs=[];qs.forEach(function(q){q.forEach(function(x){refs.push(x.ref)})});refs.push(db.doc(base));
  var jobs=[];for(var i=0;i<refs.length;i+=400){var b=db.batch();refs.slice(i,i+400).forEach(function(r){b.delete(r)});jobs.push(b.commit())}
  return Promise.all(jobs)}).catch(function(){alert('Erro ao excluir. Tente novamente.')});
}
function listView(){clear();
 var opts=Object.keys(BUS).map(function(k){return '<option value="'+k+'">'+BUS[k].nome+'</option>'}).join('');
 A.innerHTML='<h1>Viagens</h1><p class="sub"><a href="#" id="out">Sair</a></p><div class="card"><h2>Nova viagem</h2><label>Nome da viagem</label><input id="nn" placeholder="Ex.: Beto Carrero 12/12"><label>Ônibus</label><select id="nb">'+opts+'</select><button class="p" id="nv">Criar viagem</button></div><div id="tl"></div>';
 document.getElementById('out').onclick=function(e){e.preventDefault();auth.signOut()};
 document.getElementById('nv').onclick=function(){var n=document.getElementById('nn').value.trim();if(!n)return;db.collection('poltronas_viagens').add({nome:n,onibus:document.getElementById('nb').value,t:TS()});document.getElementById('nn').value=''};
 unsubs.push(db.collection('poltronas_viagens').orderBy('t','desc').onSnapshot(function(s){var box=document.getElementById('tl');box.innerHTML='';
  s.forEach(function(d){var v=d.data(),c=document.createElement('div');c.className='card';var link=location.origin+location.pathname+'?v='+d.id;
   c.innerHTML='<h2>'+esc(v.nome)+'</h2><p class="sub">'+BUS[v.onibus].nome+'</p><div class="stats" id="st'+d.id+'"></div><button class="sm" data-c="'+link+'">Copiar link do cliente</button> <button class="sm" data-o="'+d.id+'">Abrir</button> <button class="sm" data-d="'+d.id+'" data-n="'+esc(v.nome)+'">Excluir</button>';
   box.appendChild(c);
   db.collection('poltronas_viagens/'+d.id+'/ocupadas').onSnapshot(function(q){var o=q.size,t=total(v.onibus),el=document.getElementById('st'+d.id);if(el)el.innerHTML='<div><b>'+o+'</b>ocupadas</div><div><b>'+(t-o)+'</b>livres</div><div><b>'+t+'</b>total</div>'});
  });
  box.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){navigator.clipboard.writeText(b.dataset.c);b.textContent='Copiado ✓'}});
  box.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){tripView(b.dataset.o)}});
  box.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){delTrip(b.dataset.d,b.dataset.n)}});
 }));}
function tripView(id){clear();
 var base='poltronas_viagens/'+id;
 db.doc(base).get().then(function(d){
  var v=d.data(),occ={},res={},pas={},T='',M='',Q='',FC='',FS='',view=[],LV=false;
  function imp(){
   var skip=/^(colo|sem poltrona|n[aã]o)$/i;
   var rows=T.split(/\r?\n/).map(function(l){return l.split(/[;\t,]/).map(function(x){return x.trim().replace(/^"|"$/g,'')})}).filter(function(c){return c[0]});
   if(rows.length&&norm(rows[0][0])==='nome')rows.shift();
   rows=rows.filter(function(c){return !c.some(function(x){return skip.test(x)})});
   if(!rows.length){M='Nenhum nome encontrado.';draw();return}
   Promise.all(rows.map(function(r){return hid(id,r[0])})).then(function(hs){
    return db.collection(base+'/convidados').get().then(function(q){
     var ex={},add=[],rep=0,seen={},upd=[];q.forEach(function(x){ex[x.id]=1});
     hs.forEach(function(h,i){if(ex[h]){if(rows[i][2])upd.push([h,rows[i][2]]);return}if(seen[h]){rep++;return}seen[h]=1;add.push([h,rows[i]])});
     var jobs=[];
     for(var i=0;i<add.length;i+=200){var bt=db.batch();add.slice(i,i+200).forEach(function(a){bt.set(db.doc(base+'/convidados/'+a[0]),{seat:null,t:TS()});bt.set(db.doc(base+'/passageiros/'+a[0]),{nome:a[1][0],tel:a[1][1]||'',cidade:a[1][2]||'',t:TS()})});jobs.push(bt.commit())}
     for(var j=0;j<upd.length;j+=400){var bu=db.batch();upd.slice(j,j+400).forEach(function(u){bu.set(db.doc(base+'/passageiros/'+u[0]),{cidade:u[1]},{merge:true})});jobs.push(bu.commit())}
     jobs.push(db.doc(base).update({lista:true}));
     return Promise.all(jobs).then(function(){var ja=hs.length-add.length-rep;M=add.length+' importado(s)'+(rep?'; '+rep+' nome(s) repetido(s) ignorado(s)':'')+(ja?'; '+ja+' já estavam na lista (cidade atualizada quando informada)':'')+'.';T='';draw()})})}).catch(function(){M='Erro ao importar.';draw()});
  }
  function items(){
   var by={};Object.keys(res).forEach(function(k){if(res[k].h)by[res[k].h]=k});
   var L=Object.keys(pas).map(function(h){var p=pas[h];return{nome:p.nome,tel:p.tel||'',cid:p.cidade||'',seat:by[h]||'',emb:!!p.emb,h:h,ref:base+'/passageiros/'+h}});
   Object.keys(res).forEach(function(k){var r=res[k];if(!r.h)L.push({nome:r.nome,tel:r.tel||'',cid:r.cidade||'',seat:k,emb:!!r.emb,h:'',ref:base+'/reservas/'+k})});
   return L.sort(function(a,b){return a.nome.localeCompare(b.nome)});
  }
  function lista(){
   var L=items(),com=L.filter(function(i){return i.seat}).sort(function(a,b){return a.seat-b.seat}),sem=L.filter(function(i){return !i.seat}),colo=v.colo||0,tot=L.length+colo;
   function tr(i){return '<tr><td><b>'+(i.seat||'—')+'</b></td><td>'+esc(i.nome)+'</td><td>'+esc(i.cid)+'</td><td>'+esc(i.tel)+'</td></tr>'}
   A.innerHTML='<div class="noprint"><p><a href="#" id="bk2">← Voltar</a></p></div><h1>Lista de embarque</h1><p class="sub">'+esc(v.nome)+' · '+BUS[v.onibus].nome+'</p><p><b>Total de pessoas: '+tot+'</b><br>Poltronas ocupadas: '+com.length+' · Crianças de colo: '+colo+(sem.length?' · Sem poltrona escolhida: '+sem.length:'')+'</p><table><tr><th>Poltrona</th><th>Nome</th><th>Cidade</th><th>Telefone</th></tr>'+com.concat(sem).map(tr).join('')+'</table><div class="noprint card" style="margin-top:14px"><label>Crianças de colo (sem poltrona)</label><input type="number" min="0" id="co" value="'+colo+'"><button class="p" id="cp">Copiar texto</button><button id="pr" style="margin-top:8px">Imprimir / salvar PDF</button></div>';
   document.getElementById('bk2').onclick=function(e){e.preventDefault();LV=false;draw()};
   document.getElementById('co').onchange=function(e){v.colo=Math.max(0,parseInt(e.target.value,10)||0);db.doc(base).update({colo:v.colo}).then(draw)};
   document.getElementById('pr').onclick=function(){window.print()};
   document.getElementById('cp').onclick=function(){var t='LISTA DE EMBARQUE - '+v.nome+'\n'+BUS[v.onibus].nome+'\n\n'+com.map(function(i){return i.seat+' - '+i.nome+(i.cid?' ('+i.cid+')':'')+(i.tel?' - '+i.tel:'')}).join('\n')+(sem.length?'\n\nSem poltrona escolhida:\n'+sem.map(function(i){return i.nome+(i.cid?' ('+i.cid+')':'')}).join('\n'):'')+'\n\nTotal de pessoas: '+tot+'\nPoltronas ocupadas: '+com.length+'\nCriancas de colo: '+colo;navigator.clipboard.writeText(t);this.textContent='Copiado ✓'};
  }
  function lim(){if(!v.limite)return '';var d=v.limite.toDate();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function paint(){
   var L=items(),box=document.getElementById('pl');if(!box)return;
   var q=norm(Q);
   view=L.filter(function(i){return (!FC||(i.cid||'Sem cidade')===FC)&&(!FS||(FS==='e'?i.emb:!i.emb))&&(!q||norm(i.nome).indexOf(q)>-1)});
   box.innerHTML=view.map(function(i,n){return '<div class="tr"><span>'+esc(i.nome)+'<br><span class="note">'+esc(i.cid||'sem cidade')+(i.seat?' · poltrona '+i.seat:' · sem poltrona')+(i.tel?' · '+esc(i.tel):'')+'</span></span><span><button class="sm" data-i="'+n+'">'+(i.emb?'✅ Embarcou':'Marcar')+'</button>'+(i.seat?' <button class="sm" data-l="'+n+'">Liberar poltrona</button>':'')+(!i.seat&&i.tel?' <button class="sm" data-w="'+n+'">Cobrar</button>':'')+'</span></div>'}).join('')||'<p class="note">Nenhum passageiro.</p>';
   box.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){var i=view[+b.dataset.i];db.doc(i.ref).update({emb:!i.emb,embT:TS()})}});
   box.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){var i=view[+b.dataset.l];if(!confirm('Liberar a poltrona '+i.seat+' de '+i.nome+'? Ele(a) poderá escolher outra.'))return;var x=db.batch();x.delete(db.doc(base+'/ocupadas/'+i.seat));x.delete(db.doc(base+'/reservas/'+i.seat));if(i.h)x.update(db.doc(base+'/convidados/'+i.h),{seat:null});x.commit()}});
   box.querySelectorAll('[data-w]').forEach(function(b){b.onclick=function(){var i=view[+b.dataset.w],t=i.tel.replace(/\D/g,'');if(t.length<=11)t='55'+t;var link=location.origin+location.pathname+'?v='+id;window.open('https://wa.me/'+t+'?text='+encodeURIComponent('Olá, '+i.nome.split(' ')[0]+'! Escolha a sua poltrona na viagem '+v.nome+' pelo link: '+link+' (digite seu nome completo). Qualquer dúvida, é só chamar!'))}});
  }
  function draw(){
   if(LV){lista();return}
   var L=items(),emb=L.filter(function(i){return i.emb}).length,sc=L.filter(function(i){return i.seat}).length;
   var cm={};L.forEach(function(i){var c=i.cid||'Sem cidade';cm[c]=cm[c]||[0,0];cm[c][0]++;if(i.emb)cm[c][1]++});
   var cities=Object.keys(cm).sort();
   var cs=cities.map(function(c){return '<div class="tr"><span>'+esc(c)+'</span><span>'+cm[c][1]+' de '+cm[c][0]+' embarcaram</span></div>'}).join('');
   A.innerHTML='<p><a href="#" id="bk">← Voltar</a></p><h1>'+esc(v.nome)+'</h1><p class="sub">'+BUS[v.onibus].nome+'</p><div class="card">'+stats(v.onibus,occ)+mapHtml(v.onibus,occ,null)+'<p class="note">Toque numa livre para reservar manualmente; toque numa ocupada para liberar.</p></div>'+
   '<div class="card"><h2>Escolha de poltronas · '+((v.fechada||(v.limite&&new Date()>v.limite.toDate()))?'🔒 encerrada':'🟢 aberta')+'</h2><button class="p" id="fc2">'+(v.fechada?'Reabrir escolha':'Encerrar escolha agora')+'</button><label>Prazo (opcional, até o fim do dia)</label><input type="date" id="dl" value="'+lim()+'"><button id="sd" style="margin-top:8px">Salvar prazo</button><p class="note">Apague a data e salve para remover o prazo.</p></div>'+'<div class="card"><h2>Embarque · '+emb+' de '+L.length+' embarcaram</h2><button class="sm" id="lb">Lista de embarque (imprimir / copiar)</button>'+cs+'<label>Cidade</label><select id="fc"><option value="">Todas</option>'+cities.map(function(c){return '<option'+(c===FC?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select><label>Situação</label><select id="fs"><option value="">Todos</option><option value="n"'+(FS==='n'?' selected':'')+'>Não embarcaram</option><option value="e"'+(FS==='e'?' selected':'')+'>Embarcaram</option></select><label>Buscar nome</label><input id="qs"><p class="note">'+sc+' de '+L.length+' já escolheram poltrona.</p><div id="pl"></div></div>'+
   '<div class="card"><h2>Importar lista de passageiros</h2><p class="note">Um por linha: nome;telefone;cidade. Só quem tem poltrona. O cliente digita o nome dele para escolher.</p><textarea id="ta" rows="5" placeholder="Maria da Silva;11999990000;Itaúna"></textarea><label>ou escolha um arquivo (.csv ou .txt)</label><input type="file" id="fl" accept=".csv,.txt,text/csv,text/plain"><button class="p" id="im">Importar</button><p class="note">'+esc(M)+'</p></div>';
   var ta=document.getElementById('ta');ta.value=T;ta.oninput=function(){T=ta.value};
   document.getElementById('fl').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){T=r.result;draw()};r.readAsText(f)};
   document.getElementById('im').onclick=imp;
   var qs=document.getElementById('qs');qs.value=Q;qs.oninput=function(){Q=qs.value;paint()};
   document.getElementById('fc').onchange=function(e){FC=e.target.value;paint()};
   document.getElementById('fs').onchange=function(e){FS=e.target.value;paint()};
   document.getElementById('bk').onclick=function(e){e.preventDefault();listView()};
   document.getElementById('lb').onclick=function(){LV=true;draw()};
   document.getElementById('fc2').onclick=function(){v.fechada=!v.fechada;db.doc(base).update({fechada:v.fechada}).then(draw)};
   document.getElementById('sd').onclick=function(){var x=document.getElementById('dl').value,ts=x?firebase.firestore.Timestamp.fromDate(new Date(x+'T23:59:59')):null;db.doc(base).update({limite:ts}).then(function(){v.limite=ts;draw()})};
   A.querySelectorAll('.s').forEach(function(b){b.onclick=function(){var k=b.dataset.n;
    if(occ[k]){if(confirm('Liberar a poltrona '+k+'?')){var x=db.batch();x.delete(db.doc(base+'/ocupadas/'+k));x.delete(db.doc(base+'/reservas/'+k));if(res[k]&&res[k].h)x.update(db.doc(base+'/convidados/'+res[k].h),{seat:null});x.commit()}}
    else{var nome=prompt('Nome do passageiro na poltrona '+k+':');if(!nome)return;var y=db.batch();y.set(db.doc(base+'/ocupadas/'+k),{t:TS()});y.set(db.doc(base+'/reservas/'+k),{nome:nome,tel:'',t:TS()});y.commit()}}});
   paint();
  }
  unsubs.push(db.collection(base+'/ocupadas').onSnapshot(function(s){occ={};s.forEach(function(x){occ[x.id]=1});draw()}));
  unsubs.push(db.collection(base+'/reservas').onSnapshot(function(s){res={};s.forEach(function(x){res[x.id]=x.data()});draw()}));
  unsubs.push(db.collection(base+'/passageiros').onSnapshot(function(s){pas={};s.forEach(function(x){pas[x.id]=x.data()});draw()}));
 });
}

if(VID)clientView();else auth.onAuthStateChanged(function(u){u?listView():loginView()});
</script></body></html>
